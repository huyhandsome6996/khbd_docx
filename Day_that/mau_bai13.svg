<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="1600"
   height="980"
   viewBox="0 0 1600 980"
   version="1.1"
   id="svg_mau_bai13">
  <sodipodi:namedview
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1"
     inkscape:pageopacity="1"
     inkscape:zoom="0.6"
     inkscape:cx="800"
     inkscape:cy="490"
     showgrid="false" />
  <defs>
    <linearGradient id="grad_linear_h13_3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="grad_radial_h13_3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#2e7d32" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="grad_linear_ball" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="grad_radial_spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- LAYER 1: KHUNG NEN & CHU THICH (DA KHOA DE KHONG KEO NHAM KHI DAY) -->
  <g id="layer_khung_nen" inkscape:groupmode="layer" inkscape:label="1. Khung huong dan (Da khoa)" sodipodi:insensitive="true">
    <rect x="0" y="0" width="1600" height="980" fill="#f8fafc" />
    <rect x="20" y="15" width="1560" height="58" rx="10" fill="#1e3a8a" />
    <text x="800" y="52" font-family="'Times New Roman', Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      BẢNG THỊ PHẠM TRỰC TIẾP TRÊN LỚP – TIN HỌC 10 – BÀI 13 (TIẾT 1 – LỚP 10/3 – PHÒNG H.I.5)
    </text>

    <!-- Khung 1 -->
    <rect x="20" y="90" width="490" height="420" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
    <rect x="20" y="90" width="490" height="40" rx="10" fill="#dcfce7" />
    <text x="265" y="117" font-family="'Times New Roman', Arial, sans-serif" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">
      KHU VỰC 1: MỞ ĐẦU &amp; VẬN DỤNG (DƯA HẤU)
    </text>
    <text x="145" y="155" font-family="'Times New Roman', Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Mẫu 4 lớp (kéo tách cho HS xem)</text>
    <text x="385" y="155" font-family="'Times New Roman', Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">Gõ Start = 0, End = 180</text>
    <text x="265" y="485" font-family="'Times New Roman', Arial, sans-serif" font-size="13.5" font-style="italic" fill="#475569" text-anchor="middle">Chọn hình tròn phải, nhấn E, đặt Start=0, End=180 rồi Ctrl+D</text>

    <!-- Khung 2 -->
    <rect x="530" y="90" width="520" height="420" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <rect x="530" y="90" width="520" height="40" rx="10" fill="#dbeafe" />
    <text x="790" y="117" font-family="'Times New Roman', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      KHU VỰC 2: MỤC 1 – THUỘC TÍNH HÌNH KHỐI (tr. 69-70)
    </text>
    <text x="635" y="160" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">1. Chữ nhật (R)</text>
    <text x="635" y="182" font-family="'Times New Roman', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Thử Rx = 25 (bo góc)</text>
    <text x="800" y="160" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">2. Hình tròn (E)</text>
    <text x="800" y="182" font-family="'Times New Roman', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Thử Start=0, End=180</text>
    <text x="960" y="160" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">3. Ngôi sao (*)</text>
    <text x="960" y="182" font-family="'Times New Roman', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Thử Rounded = 0.25</text>
    <text x="790" y="485" font-family="'Times New Roman', Arial, sans-serif" font-size="13.5" font-style="italic" fill="#475569" text-anchor="middle">Mẹo: Nháy đúp chuột vào hình để hiện ô nhập thuộc tính phía trên!</text>

    <!-- Khung 3 -->
    <rect x="1070" y="90" width="510" height="420" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5" />
    <rect x="1070" y="90" width="510" height="40" rx="10" fill="#fef3c7" />
    <text x="1325" y="117" font-family="'Times New Roman', Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">
      KHU VỰC 3: MỤC 2 – FILL AND STROKE (Shift+Ctrl+F)
    </text>
    <text x="1325" y="160" font-family="'Times New Roman', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b" text-anchor="middle">5 kiểu tô (H.13.3): Rỗng | Đồng nhất | Thẳng | Toả tròn | Mờ</text>
    <text x="1325" y="310" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Hình thử kéo Opacity (%) &amp; bấm Radial gradient:</text>
    <text x="1325" y="485" font-family="'Times New Roman', Arial, sans-serif" font-size="13.5" font-style="italic" fill="#475569" text-anchor="middle">Mẹo: Nhấn sẵn Shift+Ctrl+F để bảng màu mở luôn bên phải!</text>

    <!-- Khung 4 -->
    <rect x="20" y="530" width="980" height="430" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2.5" />
    <rect x="20" y="530" width="980" height="40" rx="10" fill="#f3e8ff" />
    <text x="510" y="557" font-family="'Times New Roman', Arial, sans-serif" font-size="19" font-weight="bold" fill="#581c87" text-anchor="middle">
      KHU VỰC 4: MỤC 3 – CÁC PHÉP GHÉP PATH (THAO TÁC MENU PATH CHO CHẮC ĂN!)
    </text>
    <text x="175" y="605" font-family="'Times New Roman', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">A. Đám mây (Hình 13.7)</text>
    <text x="175" y="627" font-family="'Times New Roman', Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Quét 4 hình, vào Path chọn Union</text>
    <text x="485" y="605" font-family="'Times New Roman', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">B. Thử Difference / Intersection</text>
    <text x="485" y="627" font-family="'Times New Roman', Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Vuông (dưới) + Tròn (trên), chọn Path...</text>
    <text x="815" y="605" font-family="'Times New Roman', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">C. Thực tế: Logo Apple "cắn dở"</text>
    <text x="815" y="627" font-family="'Times New Roman', Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Quét táo đen + tròn trắng, chọn Difference</text>
    <text x="510" y="938" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-style="italic" fill="#6b21a8" text-anchor="middle">Lưu ý vàng: Lỡ bấm sai cứ nhấn Ctrl+Z! Nếu mất hình gốc là do nằm TRÊN, bấm phím End đưa xuống dưới!</text>

    <!-- Khung 5 -->
    <rect x="1020" y="530" width="560" height="430" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" />
    <rect x="1020" y="530" width="560" height="40" rx="10" fill="#fee2e2" />
    <text x="1300" y="557" font-family="'Times New Roman', Arial, sans-serif" font-size="19" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
      KHU VỰC 5: LUYỆN TẬP &amp; HÌNH MẪU (SGK TR. 74)
    </text>
    <text x="1140" y="610" font-family="'Times New Roman', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">H.13.14 Bông hoa</text>
    <text x="1140" y="632" font-family="'Times New Roman', Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Sao: Corners=10, Rounded=0.25</text>
    <text x="1420" y="610" font-family="'Times New Roman', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">H.13.16 Bóng bay trong suốt</text>
    <text x="1420" y="632" font-family="'Times New Roman', Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Chỉnh Opacity = 75% - 80%</text>
    <text x="1300" y="938" font-family="'Times New Roman', Arial, sans-serif" font-size="15" font-style="italic" fill="#475569" text-anchor="middle">Quả cầu 3D (mẫu Tiết 2): Hình tròn đen (Linear) + Hình tròn trắng (Radial)</text>
  </g>

  <!-- LAYER 2: CAC DOI TUONG TUONG TAC TRUC TIEP TREN INKSCAPE -->
  <g id="layer_tuong_tac" inkscape:groupmode="layer" inkscape:label="2. Hinh de giao vien bam truc tiep">

    <!-- KHU VUC 1: DUA HAU -->
    <!-- Mau 4 lop tach roi de keo xem thu tu lop -->
    <path sodipodi:type="arc" sodipodi:cx="140" sodipodi:cy="255" sodipodi:rx="100" sodipodi:ry="100" sodipodi:start="0" sodipodi:end="3.1415927"
          d="M 240,255 A 100,100 0 0 1 140,355 A 100,100 0 0 1 40,255 L 140,255 Z"
          fill="#16a34a" stroke="#14532d" stroke-width="2" />
    <path sodipodi:type="arc" sodipodi:cx="140" sodipodi:cy="255" sodipodi:rx="85" sodipodi:ry="85" sodipodi:start="0" sodipodi:end="3.1415927"
          d="M 225,255 A 85,85 0 0 1 140,340 A 85,85 0 0 1 55,255 L 140,255 Z"
          fill="#f0fdf4" />
    <path sodipodi:type="arc" sodipodi:cx="140" sodipodi:cy="255" sodipodi:rx="75" sodipodi:ry="75" sodipodi:start="0" sodipodi:end="3.1415927"
          d="M 215,255 A 75,75 0 0 1 140,330 A 75,75 0 0 1 65,255 L 140,255 Z"
          fill="#ef4444" />
    <ellipse cx="105" cy="278" rx="4" ry="8" transform="rotate(-25 105 278)" fill="#111827" />
    <ellipse cx="140" cy="292" rx="4" ry="8" fill="#111827" />
    <ellipse cx="175" cy="278" rx="4" ry="8" transform="rotate(25 175 278)" fill="#111827" />
    <ellipse cx="122" cy="306" rx="4" ry="7" transform="rotate(-10 122 306)" fill="#111827" />
    <ellipse cx="158" cy="306" rx="4" ry="7" transform="rotate(10 158 306)" fill="#111827" />

    <!-- Hinh tron xanh nguyen cho Demo Start=0, End=180 & Ctrl+D -->
    <path sodipodi:type="arc" sodipodi:cx="385" sodipodi:cy="295" sodipodi:rx="90" sodipodi:ry="90" sodipodi:start="0" sodipodi:end="6.2831853" sodipodi:open="false"
          d="M 475,295 A 90,90 0 1 1 295,295 A 90,90 0 1 1 475,295 Z"
          fill="#16a34a" stroke="#14532d" stroke-width="2" />

    <!-- KHU VUC 2: THUOC TINH HINH KHOI -->
    <!-- 1. Hinh chu nhat cho bo goc Rx, Ry -->
    <rect x="570" y="235" width="130" height="170" rx="0" ry="0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />

    <!-- 2. Hinh tron cho Start=0, End=180 -->
    <path sodipodi:type="arc" sodipodi:cx="800" sodipodi:cy="320" sodipodi:rx="65" sodipodi:ry="65" sodipodi:start="0" sodipodi:end="6.2831853" sodipodi:open="false"
          d="M 865,320 A 65,65 0 1 1 735,320 A 65,65 0 1 1 865,320 Z"
          fill="#f97316" stroke="#c2410c" stroke-width="2" />

    <!-- 3. Ngoi sao 5 canh cho tang Rounded=0.25 -->
    <path sodipodi:type="star" fill="#ef4444" stroke="#991b1b" stroke-width="2"
          id="star_demo"
          sodipodi:sides="5"
          sodipodi:cx="960"
          sodipodi:cy="320"
          sodipodi:r1="68"
          sodipodi:r2="28"
          sodipodi:arg1="-1.5707963"
          sodipodi:arg2="-0.9424778"
          inkscape:flatsided="false"
          inkscape:rounded="0"
          inkscape:randomized="0"
          d="M 960,252 L 976.5,297.3 L 1024.7,299.0 L 986.6,328.7 L 1000.0,375.0 L 960,348.0 L 920.0,375.0 L 933.4,328.7 L 895.3,299.0 L 943.5,297.3 Z" />

    <!-- KHU VUC 3: FILL & STROKE -->
    <!-- 5 o vuong giong Hinh 13.3 -->
    <rect x="1105" y="185" width="76" height="76" fill="none" stroke="#ea580c" stroke-width="4" />
    <rect x="1197" y="185" width="76" height="76" fill="#2e7d32" stroke="#ea580c" stroke-width="4" />
    <rect x="1289" y="185" width="76" height="76" fill="url(#grad_linear_h13_3)" stroke="#ea580c" stroke-width="4" />
    <rect x="1381" y="185" width="76" height="76" fill="url(#grad_radial_h13_3)" stroke="#ea580c" stroke-width="4" />
    <rect x="1473" y="185" width="76" height="76" fill="#2e7d32" fill-opacity="0.45" stroke="#ea580c" stroke-width="4" />

    <!-- Hai hinh thu Opacity va Gradient -->
    <rect x="1150" y="340" width="150" height="105" rx="12" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <path sodipodi:type="arc" sodipodi:cx="1325" sodipodi:cy="392" sodipodi:rx="65" sodipodi:ry="65" sodipodi:start="0" sodipodi:end="6.2831853"
          d="M 1390,392 A 65,65 0 1 1 1260,392 A 65,65 0 1 1 1390,392 Z"
          fill="#2563eb" fill-opacity="0.65" stroke="#1e3a8a" stroke-width="3" />
    <path sodipodi:type="arc" sodipodi:cx="1480" sodipodi:cy="392" sodipodi:rx="62" sodipodi:ry="62" sodipodi:start="0" sodipodi:end="6.2831853"
          d="M 1542,392 A 62,62 0 1 1 1418,392 A 62,62 0 1 1 1542,392 Z"
          fill="#16a34a" stroke="#14532d" stroke-width="3" />

    <!-- KHU VUC 4: 6 PHEP GHEP PATH -->
    <!-- A. 4 hinh tron tao Dam may H.13.7 -->
    <circle cx="135" cy="790" r="52" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="195" cy="760" r="62" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="255" cy="790" r="52" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <rect x="135" y="790" width="120" height="52" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />

    <!-- B. Cap Vuong (duoi) + Tron (tren) cho thu Difference / Intersection / Union -->
    <rect x="405" y="705" width="125" height="125" fill="#dc2626" fill-opacity="0.88" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="520" cy="810" r="65" fill="#f97316" fill-opacity="0.72" stroke="#9a3412" stroke-width="2" />

    <!-- C. Logo Apple (Than tao den + Hinh tron trang chong phai de bam Difference!) -->
    <path d="M 800,720 C 775,700 730,715 730,775 C 730,835 765,875 795,868 C 808,864 818,864 832,868 C 862,875 896,835 896,775 C 896,715 852,700 826,720 C 818,726 808,726 800,720 Z"
          fill="#111827" />
    <path d="M 812,712 C 812,682 835,660 860,656 C 862,684 842,708 812,712 Z" fill="#111827" />
    <circle cx="892" cy="775" r="46" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" />

    <!-- KHU VUC 5: MAU LUYEN TAP H.13.14 & H.13.16 & H.13.12 -->
    <!-- Bong hoa 10 canh mau -->
    <path sodipodi:type="star" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"
          id="flower_demo"
          sodipodi:sides="10"
          sodipodi:cx="1140"
          sodipodi:cy="760"
          sodipodi:r1="72"
          sodipodi:r2="34"
          sodipodi:arg1="-1.5707963"
          sodipodi:arg2="-1.2566371"
          inkscape:flatsided="false"
          inkscape:rounded="0.25"
          inkscape:randomized="0"
          d="M 1140,688 C 1152,688 1144,724 1151,727 C 1157,730 1172,695 1182,702 C 1192,709 1164,734 1168,740 C 1172,746 1205,727 1208,738 C 1212,749 1174,752 1174,760 C 1174,768 1212,771 1208,782 C 1205,793 1172,774 1168,780 C 1164,786 1192,811 1182,818 C 1172,825 1157,790 1151,793 C 1144,796 1152,832 1140,832 C 1128,832 1136,796 1129,793 C 1123,790 1108,825 1098,818 C 1088,811 1116,786 1112,780 C 1108,774 1075,793 1072,782 C 1068,771 1106,768 1106,760 C 1106,752 1068,749 1072,738 C 1075,727 1108,746 1112,740 C 1116,734 1088,709 1098,702 C 1108,695 1123,730 1129,727 C 1136,724 1128,688 1140,688 Z" />
    <circle cx="1140" cy="760" r="24" fill="#facc15" stroke="#dc2626" stroke-width="3" />

    <!-- Chum bong bay trong suot H.13.16 -->
    <ellipse cx="1360" cy="770" rx="34" ry="44" fill="#f97316" fill-opacity="0.78" />
    <ellipse cx="1415" cy="785" rx="34" ry="44" fill="#eab308" fill-opacity="0.78" />
    <ellipse cx="1390" cy="725" rx="34" ry="44" fill="#06b6d4" fill-opacity="0.78" />

    <!-- Qua cau 3D H.13.12 -->
    <rect x="1475" y="700" width="80" height="120" rx="8" fill="#fef08a" />
    <circle cx="1515" cy="760" r="32" fill="url(#grad_linear_ball)" />
    <circle cx="1528" cy="744" r="14" fill="url(#grad_radial_spot)" />
  </g>
</svg>
