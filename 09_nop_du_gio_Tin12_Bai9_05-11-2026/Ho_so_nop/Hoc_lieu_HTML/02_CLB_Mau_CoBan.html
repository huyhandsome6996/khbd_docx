<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mẫu trang câu lạc bộ cơ bản</title>
</head>
<body>
  <h1>Câu lạc bộ trường em</h1>
  <p>Dữ liệu dưới đây dùng cho bài thực hành.</p>
  <h2>Câu lạc bộ yêu thích</h2>
  <ul>
    <li>Bóng đá</li>
    <li>Âm nhạc</li>
  </ul>
  <h2>Các bước tham gia</h2>
  <ol>
    <li>Chọn câu lạc bộ phù hợp.</li>
    <li>Đăng kí với người phụ trách.</li>
  </ol>
  <table style="border:1px solid black;border-collapse:collapse;width:70%">
    <caption>Lịch sinh hoạt câu lạc bộ</caption>
    <tr>
      <th style="border:1px solid black;padding:8px">Câu lạc bộ</th>
      <th style="border:1px solid black;padding:8px">Lịch sinh hoạt</th>
    </tr>
    <tr>
      <td style="border:1px solid black;padding:8px">Bóng đá</td>
      <td style="border:1px solid black;padding:8px">Thứ Ba</td>
    </tr>
    <tr>
      <td style="border:1px solid black;padding:8px">Âm nhạc</td>
      <td style="border:1px solid black;padding:8px">Thứ Năm</td>
    </tr>
  </table>
</body>
</html>
